[project]
name = "ai-proctored-test-backend"
version = "0.1.0"
description = "AI-Proctored Technical Assessment & Interview Platform Backend"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic[email]==2.10.3",
    "email-validator==2.3.0",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
prod = [
    "psycopg2-binary==2.9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
